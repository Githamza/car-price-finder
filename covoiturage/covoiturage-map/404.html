<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page non trouvée | Covoiturage en France</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
        background-color: #f9fafb;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 500px;
        background-color: white;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .error-code {
        font-size: 6rem;
        font-weight: bold;
        color: #3b82f6;
        line-height: 1;
        margin-bottom: 1rem;
      }
      .map-icon {
        font-size: 3rem;
        margin: 1rem 0;
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-code">404</div>
      <div class="map-icon">🗺️</div>
      <h1 class="text-2xl font-bold mb-4">Page non trouvée</h1>
      <p class="text-gray-600 mb-6">
        La page que vous recherchez semble avoir pris une autre route.
      </p>
      <a
        href="index.html"
        class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md transition duration-300"
      >
        Retour à la carte
      </a>
    </div>
  </body>
</html>
